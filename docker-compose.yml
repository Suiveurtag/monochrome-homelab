services:
  monochrome:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        AUTH_ENABLED: "true"
        POCKETBASE_URL: ""
    image: monochrome-selfhost:latest
    container_name: monochrome-app
    restart: unless-stopped
    depends_on:
      - pocketbase
      - selfhost-importer
    ports:
      - "3000:4173"
    networks:
      - monochrome

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.30.0
    container_name: monochrome-pocketbase
    restart: unless-stopped
    command: ["serve", "--http=0.0.0.0:8090", "--dir=/pb_data", "--migrationsDir=/pb_migrations"]
    volumes:
      - ./pb_data:/pb_data
      - ./pb_migrations:/pb_migrations
    networks:
      - monochrome

  selfhost-importer:
    build:
      context: .
      dockerfile: services/spotiflac-importer/Dockerfile
      args:
        SPOTIFLAC_REF: "7a3a50e8d5b56fc7335d5822889c499f5e76e39b"
    image: monochrome-spotiflac-importer:7.1.9
    container_name: monochrome-selfhost-importer
    restart: unless-stopped
    environment:
      POCKETBASE_URL: "http://pocketbase:8090"
      MAX_IMPORT_BYTES: "2147483648"
    depends_on:
      - pocketbase
    networks:
      - monochrome

networks:
  monochrome:
    name: monochrome
